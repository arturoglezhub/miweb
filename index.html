<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arturo González — Marketing & AI Systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --paper: #efe7d6;
  --paper2: #e6dcc6;
  --ink: #1d1c17;
  --red: #c0472e;
  --ochre: #d99f2b;
  --blue: #2f5488;
  --green: #356a4d;
  --mat: #f3eee3;
}
html { -webkit-text-size-adjust: 100%; }
body { background: var(--mat); color: var(--ink); font-family: 'Jost', sans-serif; line-height: 1.55; overflow-x: hidden; }
::selection { background: var(--ink); color: var(--paper); }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* ===== top bar ===== */
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 1.1rem 2.2rem 0.6rem; }
.mono { display: flex; align-items: center; gap: 0.7rem; }
.mono .mk { width: 26px; height: 26px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-weight: 600; font-size: 0.95rem; border-radius: 50%; }
.mono .nm { font-weight: 600; font-size: 0.92rem; letter-spacing: 0.02em; }
.topmeta { font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(28,27,22,0.55); }
.topright { display: flex; align-items: center; gap: 1.1rem; }
.langtoggle { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 100px; overflow: hidden; }
.langtoggle button { font-size: 0.6rem; letter-spacing: 0.1em; font-weight: 600; padding: 0.34rem 0.62rem; color: var(--ink); background: transparent; transition: background 0.2s, color 0.2s; }
.langtoggle button.active { background: var(--ink); color: var(--paper); }

/* ===== poster grid ===== */
.poster { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 0.55rem; padding: 0.5rem 2.2rem 2.2rem; height: calc(100vh - 64px); min-height: 560px;
  grid-template-areas:
    "id    id    agents agents"
    "id    id    serv   work"
    "about about proc   bigco"
    "contact contact certs journal"; }
.tile { position: relative; overflow: hidden; border: none; text-align: left; display: flex; flex-direction: column; justify-content: space-between; padding: 1.15rem 1.25rem; transition: transform 0.5s cubic-bezier(.6,0,.2,1), box-shadow 0.5s, background-color 1.6s ease, color 1.6s ease; will-change: transform; }
.tile:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.tile .t-num { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em; opacity: 0.78; z-index: 3; font-variant-numeric: tabular-nums; }
.tile .t-num::before { content: 'Nr '; font-weight: 400; opacity: 0.6; }
.tile .t-name { font-size: clamp(1.05rem, 2vw, 1.75rem); font-weight: 600; letter-spacing: -0.015em; line-height: 0.98; text-transform: uppercase; z-index: 3; }
.tile .t-hint { font-size: 0.66rem; letter-spacing: 0.05em; opacity: 0.65; margin-top: 0.25rem; z-index: 3; font-weight: 400; }
.tile .geo { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.tile:not(.static) { cursor: pointer; }
.tile:not(.static):hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(28,27,22,0.16); z-index: 5; }
.tile:not(.static):active { transform: translateY(-1px) scale(0.995); }

/* tile color themes */
.t-paper { background: var(--paper); color: var(--ink); }
.t-ink { background: var(--ink); color: var(--paper); }
.t-red { background: var(--red); color: var(--paper); }
.t-ochre { background: var(--ochre); color: var(--ink); }
.t-blue { background: var(--blue); color: var(--paper); }
.t-green { background: var(--green); color: var(--paper); }

.area-id { grid-area: id; } .area-agents { grid-area: agents; } .area-serv { grid-area: serv; }
.area-work { grid-area: work; } .area-about { grid-area: about; } .area-proc { grid-area: proc; }
.area-bigco { grid-area: bigco; } .area-contact { grid-area: contact; } .area-certs { grid-area: certs; } .area-journal { grid-area: journal; }

/* identity tile */
.id-mark { position: absolute; right: 1.1rem; top: 1.1rem; display: flex; gap: 0.5rem; z-index: 2; }
.id-mark span { width: 16px; height: 16px; }
.id-title { z-index: 3; }
.id-title h1 { font-size: clamp(1.8rem, 4.4vw, 3.7rem); font-weight: 600; line-height: 0.95; letter-spacing: -0.01em; text-transform: uppercase; }
.id-title .role { font-size: clamp(0.72rem, 1vw, 0.92rem); letter-spacing: 0.16em; text-transform: uppercase; margin-top: 0.9rem; color: rgba(28,27,22,0.62); font-weight: 500; }
.id-foot { z-index: 3; font-size: 0.66rem; letter-spacing: 0.06em; color: rgba(28,27,22,0.55); display: flex; gap: 1.4rem; flex-wrap: wrap; }
.id-foot b { font-weight: 600; color: var(--ink); }

/* ===== geometry primitives ===== */
.g { position: absolute; }
.circle { border-radius: 50%; }
.half-b { border-radius: 100% 100% 0 0 / 100% 100% 0 0; }
.half-t { border-radius: 0 0 100% 100% / 0 0 100% 100%; }
.half-r { border-radius: 0 100% 100% 0 / 0 100% 100% 0; }
.half-l { border-radius: 100% 0 0 100% / 100% 0 0 100%; }
.q-tl { border-radius: 100% 0 0 0; } .q-tr { border-radius: 0 100% 0 0; }
.q-br { border-radius: 0 0 100% 0; } .q-bl { border-radius: 0 0 0 100%; }
.tri { clip-path: polygon(0 100%, 100% 100%, 100% 0); }
.tri-l { clip-path: polygon(0 0, 0 100%, 100% 100%); }

/* fill helpers */
.f-ink{background:var(--ink)} .f-paper{background:var(--paper)} .f-red{background:var(--red)}
.f-ochre{background:var(--ochre)} .f-blue{background:var(--blue)} .f-green{background:var(--green)}

/* ===== viewer (detail) ===== */
.viewer { position: fixed; inset: 0; z-index: 70; background: var(--paper); display: none; flex-direction: column; clip-path: circle(0% at var(--cx,50%) var(--cy,50%)); transition: clip-path 0.62s cubic-bezier(.66,0,.2,1); will-change: clip-path; }
.viewer.show { display: flex; }
.viewer.open { clip-path: circle(150% at var(--cx,50%) var(--cy,50%)); }
.v-head { display: flex; align-items: center; gap: 1.2rem; padding: 1.2rem 2.2rem; border-bottom: 1.5px solid var(--ink); flex-shrink: 0; }
.back { display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.6rem 1.1rem 0.6rem 0.8rem; border: 1.5px solid var(--ink); border-radius: 100px; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; transition: background 0.2s, color 0.2s; }
.back:hover { background: var(--ink); color: var(--paper); }
.back .arr { display: inline-grid; place-items: center; width: 16px; height: 16px; }
.v-head-id { display: flex; align-items: baseline; gap: 0.9rem; }
.v-head-num { font-size: 0.72rem; letter-spacing: 0.18em; opacity: 0.6; font-weight: 500; }
.v-head-title { font-size: clamp(1.1rem, 2.4vw, 1.9rem); font-weight: 600; text-transform: uppercase; letter-spacing: 0.01em; white-space: nowrap; }
.v-accent { width: 16px; height: 16px; border-radius: 50%; margin-left: auto; }
.v-body { overflow-y: auto; flex: 1; }
.v-inner { max-width: 1080px; margin: 0 auto; padding: 3.2rem 2.2rem 5rem;
  opacity: 0; transform: translateY(22px); transition: opacity 0.5s ease 0.18s, transform 0.6s cubic-bezier(.2,.7,.2,1) 0.18s; }
.viewer.open .v-inner { opacity: 1; transform: none; }

/* detail typography */
.lead { font-size: clamp(1.3rem, 2.6vw, 2.1rem); font-weight: 300; line-height: 1.28; letter-spacing: -0.01em; max-width: 24ch; margin-bottom: 3rem; }
.lead b { font-weight: 600; }
.eyer { font-size: 0.66rem; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(28,27,22,0.5); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.7rem; }
.eyer::before { content: ''; width: 1.5rem; height: 2px; background: currentColor; opacity: 0.6; }
.prose p { font-size: 1rem; line-height: 1.85; color: rgba(28,27,22,0.82); max-width: 60ch; margin-bottom: 1.2rem; font-weight: 400; }

/* stat row */
.statline { display: grid; grid-template-columns: repeat(3,1fr); border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); margin: 2.2rem 0 2.6rem; }
.statline.s4 { grid-template-columns: repeat(4,1fr); }
.st { padding: 1.5rem 1.5rem 1.5rem 0; }
.st + .st { border-left: 1px solid rgba(28,27,22,0.18); padding-left: 1.5rem; }
.st-v { font-size: 2.6rem; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
.st-l { font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(28,27,22,0.55); margin-top: 0.5rem; line-height: 1.4; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.6rem; }
.chip { font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; border: 1.5px solid rgba(28,27,22,0.3); padding: 0.4rem 0.8rem; border-radius: 100px; }

/* two-col */
.cols { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 3rem; align-items: start; }
.about-photo { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; filter: grayscale(100%) contrast(1.04); border: 1.5px solid var(--ink); background: var(--paper); }

/* numbered list (services/process) */
.nlist { display: grid; gap: 1.5rem; }
.nrow { display: grid; grid-template-columns: 56px 1fr; gap: 1.4rem; padding-bottom: 1.5rem; border-bottom: 1px solid rgba(28,27,22,0.18); align-items: start; }
.nrow:last-child { border-bottom: none; }
.nrow .nn { font-size: 1.7rem; font-weight: 600; line-height: 1; }
.nrow h4 { font-size: 1.15rem; font-weight: 600; margin-bottom: 0.5rem; }
.nrow p { font-size: 0.92rem; line-height: 1.75; color: rgba(28,27,22,0.78); max-width: 62ch; }

/* agents */
.agent-list { display: grid; gap: 1.4rem; }
.agentc { border: 1.5px solid var(--ink); padding: 1.8rem; display: grid; grid-template-columns: 1fr auto; gap: 1.5rem 2rem; align-items: center; }
.agentc .al { }
.agentc .atag { font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(28,27,22,0.55); margin-bottom: 0.7rem; display: flex; align-items: center; gap: 0.5rem; }
.agentc .atag .d { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.agentc h4 { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.6rem; line-height: 1.15; }
.agentc p { font-size: 0.9rem; line-height: 1.7; color: rgba(28,27,22,0.78); max-width: 58ch; }
.agentc .ametrics { display: flex; gap: 1.8rem; flex-wrap: wrap; }
.agentc .ametrics.col { flex-direction: column; gap: 1.1rem; justify-content: center; }
.ametric .m { font-size: 1.9rem; font-weight: 600; line-height: 1; }
.ametric .ml { font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(28,27,22,0.5); margin-top: 0.3rem; white-space: nowrap; }
.agentc.feat { grid-template-columns: 1.5fr 1fr; align-items: stretch; }
.deeplist { margin-top: 1.3rem; border-top: 1.5px solid rgba(28,27,22,0.2); }
.deeplist div { padding: 0.6rem 0; border-bottom: 1px solid rgba(28,27,22,0.13); font-size: 0.84rem; line-height: 1.55; color: rgba(28,27,22,0.82); display: flex; gap: 0.65rem; }
.deeplist div::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--red); margin-top: 0.5rem; flex-shrink: 0; }
.apills { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1.3rem; }
.apills span { font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; border: 1.5px solid rgba(28,27,22,0.28); padding: 0.32rem 0.62rem; border-radius: 100px; color: rgba(28,27,22,0.72); white-space: nowrap; }
.feat-r { background: var(--ink); color: var(--paper); margin: -1.8rem -1.8rem -1.8rem 0; padding: 1.8rem; display: flex; flex-direction: column; gap: 1.2rem; justify-content: center; }
.feat-r .ametric .m { color: var(--paper); }
.feat-r .ametric .ml { color: rgba(236,226,205,0.55); }

/* work */
.workt { width: 100%; border-collapse: collapse; }
.workt tr { border-top: 1px solid rgba(28,27,22,0.2); }
.workt tr:last-child { border-bottom: 1px solid rgba(28,27,22,0.2); }
.work-cell { padding: 1.5rem 1rem 1.5rem 0; vertical-align: top; }
.work-ind { font-size: 0.64rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(28,27,22,0.5); }
.work-name { font-size: 1.15rem; font-weight: 600; margin-top: 0.3rem; }
.work-desc { font-size: 0.86rem; line-height: 1.65; color: rgba(28,27,22,0.7); max-width: 52ch; margin-top: 0.5rem; }
.work-big { font-size: 1.9rem; font-weight: 600; text-align: right; white-space: nowrap; letter-spacing: -0.01em; }
.work-big small { display: block; font-size: 0.62rem; font-weight: 400; letter-spacing: 0.04em; color: rgba(28,27,22,0.5); text-transform: uppercase; margin-top: 0.3rem; }
.wcard { border: 1.5px solid var(--ink); padding: 1.8rem; margin-bottom: 1.3rem; }
.wcard .wind { font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--red); font-weight: 500; }
.wcard h4 { font-size: 1.3rem; font-weight: 600; margin: 0.5rem 0 0.9rem; line-height: 1.15; }
.wcard > p { font-size: 0.9rem; line-height: 1.78; color: rgba(28,27,22,0.8); max-width: 76ch; }
.wstats { display: grid; grid-template-columns: repeat(4,1fr); border-top: 1.5px solid rgba(28,27,22,0.2); margin-top: 1.5rem; }
.wstats.s2 { grid-template-columns: repeat(2,1fr); } .wstats.s3 { grid-template-columns: repeat(3,1fr); }
.wstat { padding: 1.1rem 1.2rem 0; }
.wstat:not(:first-child) { border-left: 1px solid rgba(28,27,22,0.16); }
.wstat .wv { font-size: 1.65rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.wstat .wl { font-size: 0.6rem; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(28,27,22,0.55); margin-top: 0.45rem; line-height: 1.45; }
.wpills { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1.3rem; }
.wpills span { font-size: 0.58rem; letter-spacing: 0.05em; text-transform: uppercase; border: 1.5px solid rgba(28,27,22,0.25); padding: 0.28rem 0.55rem; border-radius: 100px; color: rgba(28,27,22,0.65); white-space: nowrap; }

/* big co */
.bcgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem; margin-top: 1rem; }
.bccard { border: 1.5px solid var(--ink); padding: 1.8rem; }
.bccard .co { font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(28,27,22,0.55); margin-bottom: 0.8rem; }
.bccard h4 { font-size: 1.15rem; font-weight: 600; margin-bottom: 0.8rem; }
.bccard p { font-size: 0.88rem; line-height: 1.72; color: rgba(28,27,22,0.78); }
.bcnote { grid-column: 1/-1; background: var(--ink); color: var(--paper); padding: 1.6rem 1.8rem; font-size: 0.95rem; line-height: 1.7; }
.bcnote b { font-weight: 600; }

/* certs */
.certgrid { display: grid; grid-template-columns: repeat(2,1fr); gap: 0; border: 1.5px solid var(--ink); }
.certc { padding: 1.3rem 1.4rem; border-bottom: 1px solid rgba(28,27,22,0.18); border-right: 1px solid rgba(28,27,22,0.18); }
.certc:nth-child(2n) { border-right: none; }
.certc:nth-last-child(-n+2) { border-bottom: none; }
.certc .ci { font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); margin-bottom: 0.5rem; font-weight: 500; }
.certc .cn { font-size: 0.92rem; font-weight: 500; line-height: 1.35; margin-bottom: 0.4rem; }
.certc .cd { font-size: 0.64rem; letter-spacing: 0.06em; color: rgba(28,27,22,0.5); }

/* contact */
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: center; }
.cbtn { display: flex; align-items: center; gap: 1.3rem; padding: 1.2rem 1.4rem; border: 1.5px solid var(--ink); text-decoration: none; color: var(--ink); transition: 0.22s; margin-bottom: 0.8rem; }
.cbtn:hover { background: var(--ink); color: var(--paper); transform: translateX(4px); }
.cbtn .ct { font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.6; min-width: 72px; }
.cbtn .cv { font-size: 0.95rem; font-weight: 500; }
.cbtn .ca { margin-left: auto; }
.cmeta { border: 1.5px solid var(--ink); }
.cmeta div { display: flex; justify-content: space-between; padding: 1rem 1.3rem; border-bottom: 1px solid rgba(28,27,22,0.18); font-size: 0.86rem; }
.cmeta div:last-child { border-bottom: none; }
.cmeta .k { color: rgba(28,27,22,0.55); letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.68rem; align-self: center; }
.cmeta .vv { font-weight: 500; }

/* footer line */
.posterfoot { display: flex; justify-content: space-between; align-items: center; padding: 0 2.2rem 1rem; font-size: 0.62rem; letter-spacing: 0.08em; color: rgba(28,27,22,0.5); text-transform: uppercase; }

/* hint pulse on first load */
.enterhint { position: fixed; bottom: 4.6rem; left: 50%; transform: translateX(-50%); z-index: 40; font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(28,27,22,0.5); display: flex; align-items: center; gap: 0.6rem; transition: opacity 0.5s; }
.enterhint .dotp { width: 6px; height: 6px; border-radius: 50%; background: var(--red); animation: dp 1.6s infinite; }
@keyframes dp { 0%,100%{opacity:1} 50%{opacity:0.2} }

/* tiles are always visible — never gate visibility on an animation */
.tile { opacity: 1; }

/* ===== organic shapes ===== */
.blob1 { border-radius: 62% 38% 54% 46% / 56% 44% 56% 44%; }
.blob2 { border-radius: 42% 58% 38% 62% / 60% 38% 62% 40%; }
.pill { border-radius: 100px; }
.leaf { border-radius: 0 100% 0 100%; }
.leaf-alt { border-radius: 100% 0 100% 0; }
.tri-r { clip-path: polygon(0 0, 100% 50%, 0 100%); }
.ring { border-radius: 50%; }
.semi-t { border-radius: 100% 100% 0 0 / 100% 100% 0 0; }

/* ===========================================================
   CHOREOGRAPHED MOTION
   Motifs rest in their natural pose. A JS conductor adds .play
   to one or two tiles at a time, firing a single finite cycle,
   so only ~2 things move (and ~2 recolor) at any moment.
   =========================================================== */
.geo .motif { transform-origin: center; }
.eye-lens { position: absolute; inset: 0; border-radius: 50%; }
.eye-pupil { position: absolute; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%,-50%); }
.bar { display: flex; flex-direction: column-reverse; gap: 4px; transform-origin: bottom; }
.bar > span { display: block; }

/* About — eye blink + glance */
.play .eye { animation: blink 2.8s ease-in-out 1 both; }
.play .eye-pupil { animation: look 2.8s ease-in-out 1 both; }
@keyframes blink { 0%,68%,100% { transform: scaleY(1); } 78% { transform: scaleY(0.08); } 86% { transform: scaleY(1); } }
@keyframes look { 0%,14%,100% { margin-left: 0; } 44% { margin-left: -7px; } 74% { margin-left: 8px; } }

/* Services — segmented equalizer (one short run) */
.play .bar.b1 { animation: eq 0.85s ease-in-out 3 both; }
.play .bar.b2 { animation: eq 0.85s ease-in-out 3 0.12s both; }
.play .bar.b3 { animation: eq 0.85s ease-in-out 3 0.24s both; }
@keyframes eq { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.45); } }

/* Agents — concentric marks pulse once */
.play .pz  { animation: pz 1.5s ease-in-out 1 both; }
.play .pz.p2 { animation-delay: 0.16s; } .play .pz.p3 { animation-delay: 0.32s; }
@keyframes pz { 0%,100% { transform: scale(1); } 48% { transform: scale(0.8); } }

/* Work — triangles flip in a wave (1923 poster) */
.play .tflip { animation: tflip 1.7s ease-in-out 1 both; }
.play .tflip.t2 { animation-delay: 0.14s; } .play .tflip.t3 { animation-delay: 0.28s; } .play .tflip.t4 { animation-delay: 0.42s; }
@keyframes tflip { 0%,40%,100% { transform: scaleY(1); } 20% { transform: scaleY(-1); } }

/* Process — quarters assemble one by one (build, not spin) */
.play .pq { animation: build 1.9s cubic-bezier(.2,.8,.2,1) 1 both; }
.play .pq.q2 { animation-delay: 0.22s; } .play .pq.q3 { animation-delay: 0.44s; } .play .pq.q4 { animation-delay: 0.66s; }
@keyframes build { 0% { opacity: 0; transform: scale(0.2) rotate(-40deg); } 55%,100% { opacity: 1; transform: scale(1) rotate(0); } }

/* Big Co — nested squares radiate outward (scale = structure) */
.play .nestp { animation: radiate 2s ease-in-out 1 both; }
.play .nestp.n2 { animation-delay: 0.16s; } .play .nestp.n3 { animation-delay: 0.32s; }
@keyframes radiate { 0%,100% { transform: scale(1); } 50% { transform: scale(0.7); } }

/* Certifications — four badges pop in sequence */
.play .cmark { animation: pop 1.5s cubic-bezier(.2,.8,.2,1) 1 both; }
.play .cmark.m2 { animation-delay: 0.12s; } .play .cmark.m3 { animation-delay: 0.24s; } .play .cmark.m4 { animation-delay: 0.36s; }

<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
const META = {
  about:   { num:'01', title:'About',          accent:'var(--blue)' },
  serv:    { num:'02', title:'Services',        accent:'var(--ochre)' },
  agents:  { num:'03', title:'AI Agents',       accent:'var(--ink)' },
  work:    { num:'04', title:'Work',            accent:'var(--red)' },
  proc:    { num:'05', title:'Process',         accent:'var(--green)' },
  bigco:   { num:'06', title:'Big Companies',   accent:'var(--blue)' },
  certs:   { num:'07', title:'Certifications',  accent:'var(--ochre)' },
  contact: { num:'08', title:'Contact',         accent:'var(--ink)' },
};
const curtain = document.getElementById('curtain');
const viewer  = document.getElementById('viewer');
const vInner  = document.getElementById('vInner');
const vNum    = document.getElementById('vNum');
const vTitle  = document.getElementById('vTitle');
const vAccent = document.getElementById('vAccent');
const back    = document.getElementById('back');
const hint    = document.getElementById('enterhint');
let lastTile = null;

function centerOf(el){ const r = el.getBoundingClientRect(); return { x: r.left + r.width/2, y: r.top + r.height/2 }; }

function openTile(tile){
  const key = tile.dataset.key;
  const meta = META[key];
  if (!meta) return;
  if (viewer.classList.contains('show')) return;
  lastTile = tile;
  hint.style.opacity = '0';

  // origin of the radial reveal = tile center
  const c = centerOf(tile);
  viewer.style.setProperty('--cx', c.x + 'px');
  viewer.style.setProperty('--cy', c.y + 'px');

  // load content + header
  renderPanel(key);

  viewer.classList.add('show');
  void viewer.offsetWidth;                       // reflow so clip-path animates
  requestAnimationFrame(() => viewer.classList.add('open'));
}

function closeTile(){
  if (!viewer.classList.contains('show')) return;
  viewer.classList.remove('open');               // clip shrinks back to the tile point
  clearTimeout(window.__vT);
  window.__vT = setTimeout(() => {                // guaranteed hide — grid can never stay covered
    viewer.classList.remove('show');
  }, 700);
}

document.querySelectorAll('.tile[data-key]').forEach(t => {
  t.addEventListener('click', () => openTile(t));
});
back.addEventListener('click', closeTile);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTile(); });

// keep the reveal origin sensible if the window resizes while closed
addEventListener('resize', () => { if (!viewer.classList.contains('show') && lastTile) { const c = centerOf(lastTile); viewer.style.setProperty('--cx', c.x+'px'); viewer.style.setProperty('--cy', c.y+'px'); } });

// hide hint after a while
setTimeout(() => { hint.style.opacity = '0'; }, 6000);

// ============================================================
// CONDUCTOR — rhythm, not chaos.
// Every beat: fire motion on ~2 tiles and recolor ~2 OTHER tiles,
// each on its own rotation, so the poster breathes in turns
// instead of everything moving at once.
// ============================================================
const PAL = ['--red', '--blue', '--green', '--ink'];

// tiles that recolor (services + identity stay as calm anchors)
const colorKeys = ['about','agents','work','proc','bigco','certs','contact'];
const colorIdx = { about:1, agents:3, work:0, proc:2, bigco:1, certs:2, contact:3 };
function paint(key){
  const t = document.querySelector('.tile[data-key="'+key+'"]');
  if (t) t.style.backgroundColor = 'var(' + PAL[((colorIdx[key] % 4) + 4) % 4] + ')';
}
colorKeys.forEach(paint); // set staggered starting colors once

// tiles that move, in a pleasing performance order
const motionKeys = ['about','serv','agents','work','journal','proc','bigco','certs','contact'];
function tileEl(key){ return key === 'journal' ? document.querySelector('.area-journal') : document.querySelector('.tile[data-key="'+key+'"]'); }

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduce) {
  let mPtr = 0;   // motion pointer
  let cPtr = 4;   // color pointer (offset so movers ≠ recolorers)

  function fireMotion(key){
    const t = tileEl(key);
    if (!t || (t === lastTile && viewer.classList.contains('show'))) return;
    t.classList.remove('play');
    void t.offsetWidth;            // reflow → restart the one-shot animation
    t.classList.add('play');
    setTimeout(() => t.classList.remove('play'), 2600);
  }

  function beat(){
    // skip while a detail panel is open (keep the grid calm underneath)
    if (!viewer.classList.contains('show')) {
      fireMotion(motionKeys[mPtr % motionKeys.length]);
      fireMotion(motionKeys[(mPtr + 1) % motionKeys.length]);
      mPtr += 2;

      const k1 = colorKeys[cPtr % colorKeys.length];
      const k2 = colorKeys[(cPtr + 1) % colorKeys.length];
      colorIdx[k1]++; paint(k1);
      colorIdx[k2]++; paint(k2);
      cPtr += 2;
    }
  }

  // first beat after a short settle, then a calm cadence
  setTimeout(beat, 1400);
  setInterval(beat, 2600);
}
</script>
